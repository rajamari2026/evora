name: event_roll
description: Premium photo gallery with date grouping, named events and batch sharing.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.2.0
  shared_preferences: ^2.2.2
  share_plus: ^10.0.1
  archive: ^3.6.1
  path_provider: ^2.1.3
  google_fonts: ^6.2.1
  intl: ^0.19.0
  http: ^1.2.0
  cryptography: ^2.7.0
  file_picker: ^8.1.7
  package_info_plus: ^8.1.2
  open_filex: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
