<style>
  :root { --bg:#050507; --ink:#f5f5f7; --dim:#a1a1aa; --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.14); --accent:#0a84ff; --green:#30d158; --red:#ff453a; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f5fa; --ink:#111114; --dim:#5b5b66; --card:rgba(255,255,255,.75); --line:rgba(0,0,0,.1); }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; color:var(--ink); background:var(--bg);
    font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-image: radial-gradient(520px 520px at 8% -5%, rgba(10,132,255,.28), transparent 70%),
                      radial-gradient(560px 560px at 95% 30%, rgba(191,90,242,.22), transparent 70%),
                      radial-gradient(520px 520px at 20% 105%, rgba(48,209,88,.16), transparent 70%);
    background-attachment: fixed; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 18px 80px; }
  header { display:flex; align-items:center; gap:12px; padding:10px 0 22px; }
  header img { width:40px; height:40px; border-radius:11px; }
  header h1 { margin:0; font-size:22px; letter-spacing:-.4px; flex:1; }
  .glass { background:var(--card); border:1px solid var(--line); border-radius:20px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .btn { appearance:none; border:0; border-radius:14px; padding:11px 18px; font:inherit; font-weight:600; cursor:pointer;
    background:var(--accent); color:#fff; }
  .btn.ghost { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .btn.red { background:var(--red); } .btn.green { background:var(--green); color:#04210d; }
  .btn:disabled { opacity:.5; cursor:default; }
  input { width:100%; padding:13px 14px; border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; margin-top:10px; }
  .login { max-width:400px; margin:8vh auto 0; padding:26px; }
  .login h2 { margin:0 0 6px; font-size:24px; }
  .dim { color:var(--dim); font-size:14px; }
  .err { color:var(--red); margin-top:10px; font-size:14px; }
  .tabs { display:inline-flex; padding:4px; gap:4px; border-radius:16px; margin-bottom:22px; }
  .tabs button { border:0; background:transparent; color:var(--ink); padding:9px 16px; border-radius:12px; font:inherit; font-weight:600; cursor:pointer; }
  .tabs button.on { background:var(--accent); color:#fff; }
  .badge { background:var(--red); color:#fff; border-radius:10px; padding:1px 7px; font-size:12px; margin-left:6px; }
  .sender { margin:26px 0 12px; display:flex; align-items:center; gap:10px; font-weight:700; }
  .av { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700;
    background:linear-gradient(135deg,#0a84ff,#5e5ce6); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
  .card { padding:16px; cursor:pointer; transition: transform .15s; }
  .card:hover { transform: translateY(-2px); }
  .card h3 { margin:0 0 4px; font-size:17px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .pill { font-size:12px; padding:3px 9px; border-radius:20px; border:1px solid var(--line); color:var(--dim); }
  .pill.ok { color:var(--green); border-color:var(--green); }
  .photos { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; margin-top:16px; }
  .ph { position:relative; aspect-ratio:1; border-radius:14px; overflow:hidden; background:rgba(128,128,128,.18); cursor:zoom-in; }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .25s; }
  .ph img.in { opacity:1; }
  .ph .dl { position:absolute; right:8px; bottom:8px; width:34px; height:34px; border-radius:50%; border:0; cursor:pointer;
    background:rgba(0,0,0,.6); color:#fff; font-size:16px; }
  .empty { text-align:center; padding:60px 10px; color:var(--dim); }
  #lb { position:fixed; inset:0; background:rgba(0,0,0,.94); display:none; z-index:20; align-items:center; justify-content:center; }
  #lb.on { display:flex; }
  #lb img { max-width:94vw; max-height:86vh; border-radius:8px; }
  #lb .bar { position:absolute; top:0; left:0; right:0; display:flex; gap:10px; align-items:center; padding:14px; color:#fff; }
  #lb .nav { position:absolute; top:50%; transform:translateY(-50%); width:46px; height:46px; border-radius:50%; border:0; background:rgba(255,255,255,.16); color:#fff; font-size:22px; cursor:pointer; }
  #toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:#111; color:#fff; padding:12px 18px; border-radius:14px; display:none; z-index:30; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="lb">
  <div class="bar"><button class="btn ghost" id="lbClose">Close</button><span id="lbCount" style="flex:1"></span><button class="btn" id="lbDl">Download</button></div>
  <button class="nav" id="lbPrev" style="left:16px">&#8249;</button>
  <img id="lbImg" alt="">
  <button class="nav" id="lbNext" style="right:16px">&#8250;</button>
</div>
<div id="toast"></div>

<script src="/app.js"></script>
</body>
</html>
